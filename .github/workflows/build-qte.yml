# Builds the whole Unit Possession Workshop pack on GitHub's Windows machines.
# Nothing is installed on your PC. Run it from the Actions tab.
name: Build QTE and HUD
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build components, bridge, Lua and pack
        run: python tools/workshop/github_build173.py
      - uses: actions/upload-artifact@v4
        with:
          name: possession-pack
          path: |
            gh-out/package/*
            gh-out/bin/*.dll
            gh-out/bin/*.exe
